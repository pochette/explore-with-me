services:
  stats-server:
    build:
      context: .
      dockerfile: ewm-stat-service/Dockerfile
    ports:
      - "9090:9090"
      - "5006:5006"
    depends_on:
      - stats-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/ewm_stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"

  stats-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ewm_stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  ewm-service:
    build:
      context: .
      dockerfile: ewm-main-service/Dockerfile


    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      - ewm-db
      - stats-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      STATS_SERVER_URL: http://stats-server:9090
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

  ewm-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ewm_main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
